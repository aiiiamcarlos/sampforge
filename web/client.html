<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>SampForge</title><link rel="stylesheet" href="client.css"><script src="client.js" defer></script></head><body>
<header class="titlebar"><div class="identity"><span class="logo">SF</span><span>SAMPFORGE</span></div><div class="window-controls"><button data-window="minimize" aria-label="Minimizar"><svg viewBox="0 0 16 16"><path d="M3 11h10"/></svg></button><button data-window="maximize" aria-label="Maximizar"><svg viewBox="0 0 16 16"><path d="M3 3h10v10H3z"/></svg></button><button data-window="close" aria-label="Cerrar"><svg viewBox="0 0 16 16"><path d="m4 4 8 8m0-8-8 8"/></svg></button></div></header>
<nav><button data-tab="servers" class="active" aria-current="page">Servidores</button><button data-tab="settings">Configuración</button><span id="version"></span></nav>
<main><section id="servers" aria-label="Servidores"><div class="toolbar"><label class="search"><span>Buscar</span><input id="search" type="search" placeholder="Nombre o dirección" aria-label="Buscar servidor"></label><details class="filters"><summary>Filtros</summary><div><label>Idioma<input id="language" placeholder="Español"></label><label>Jugadores<input id="minimum" type="number" min="0" placeholder="Desde"></label><label>Orden<select id="sort"><option value="players">Más jugadores</option><option value="name">Nombre</option></select></label></div></details><button id="refresh">Actualizar</button></div><div class="table-shell"><table><thead><tr><th>Servidor <span id="count"></span></th><th>Jugadores</th><th>Idioma</th></tr></thead><tbody id="rows"></tbody></table><p id="empty" hidden></p></div><div class="paging"><button id="previous" aria-label="Página anterior">Anterior</button><span id="page"></span><button id="next" aria-label="Página siguiente">Siguiente</button></div></section>
<section id="settings" hidden aria-label="Configuración"><div class="path-card"><h1>Configuración</h1><label>Carpeta de GTA</label><p id="game-path">Sin seleccionar</p><button id="choose-game" class="primary">Cambiar carpeta</button></div><div class="artwork" aria-hidden="true"></div></section></main>
<footer><div class="chosen"><span id="selected-name">Selecciona un servidor</span><small id="selected-address"></small></div><label class="nickname">Nombre<input id="nickname" maxlength="24" autocomplete="off" spellcheck="false" aria-label="Nombre de jugador"></label><button id="play" class="primary" disabled>Jugar</button></footer><div id="connection" role="status" hidden><span id="connection-text"></span><button id="retry">Reintentar</button></div><div id="status" role="status" aria-live="polite" hidden></div></body></html>
