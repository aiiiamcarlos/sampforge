name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: node scripts/prepare-test-clients.mjs
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: SampForge-Windows-x64
          path: dist/SampForge-Setup-*.exe
